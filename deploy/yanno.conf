# The site, for /etc/nginx/conf.d/ with the domain and certificates set. It serves the built app
# from /opt/yanno/build, and each update is:
#   rsync -a --checksum --delete-delay --delay-updates build/ server:/opt/yanno/build/

# Debian's mime.types leaves it out, and browsers refuse a module of another type
types {
    application/javascript mjs;
}

map $uri $yanno_cache {
    ~^/_app/immutable/ "public, max-age=31536000, immutable";
    default            "no-cache";
}

limit_conn_zone $binary_remote_addr zone=yanno_models:10m;

server {
    listen 80;
    listen [::]:80;
    server_name yanno.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yanno.example.org;
    ssl_certificate     /etc/letsencrypt/live/yanno.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yanno.example.org/privkey.pem;

    root /opt/yanno/build;

    # An add_header inside a location would drop all of these there
    add_header Strict-Transport-Security "max-age=31536000" always;
    # The CPU's threads need these two on every response
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $yanno_cache always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # The app finds its pages itself
    location / {
        try_files $uri /index.html;
    }
    location ~ \.[^/]+$ {
        try_files $uri =404;
    }
    # Its ^~ keeps the path from the regular expression above
    location ^~ /models/ {
        limit_conn yanno_models 6;
        try_files $uri =404;
    }
}
